<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mantiq — Let's have some Mantiq about AI</title>
    <meta name="description" content="Mantiq — Let's have some Mantiq about AI. Master Russell & Norvig's Artificial Intelligence with interactive visual simulations, mathematical proofs, and university exam preparation." />
    <meta name="theme-color" content="#090d16" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker: only register in production builds; unregister on localhost to avoid stale cache
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then((reg) => {
              console.log('AIMA PWA Service Worker registered:', reg.scope);
            }).catch((err) => {
              console.log('AIMA PWA Service Worker registration failed:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
